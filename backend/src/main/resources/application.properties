spring.application.name=backend
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/rap?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JWT (override JWT_SECRET in application-local.properties for anything beyond local dev)
app.jwt.secret=${JWT_SECRET:ThisIsADevOnlyJwtSecretKeyAtLeast32CharsLong}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# Set app.cloudinary.* in application-local.properties. Empty env defaults here
# would override those values and break uploads.

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB
server.tomcat.max-http-form-post-size=120MB
server.tomcat.max-swallow-size=120MB

spring.main.banner-mode=off

# JPA Additional Settings
spring.jpa.open-in-view=false

# OAuth2 Google Login
# Google Cloud Console → Authorized redirect URIs must include this exact URL.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Console Output
spring.output.ansi.enabled=always

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Payments (eSewa UAT is public and free; Khalti needs a free test-merchant secret)
app.payment.commitment-fee=100
app.payment.commission-percent=0.08
app.payment.frontend-base-url=${PAYMENT_FRONTEND_URL:http://localhost:5173}
app.payment.esewa.product-code=${ESEWA_PRODUCT_CODE:EPAYTEST}
app.payment.esewa.secret=${ESEWA_SECRET:}
app.payment.esewa.form-url=${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
app.payment.esewa.status-url=${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
app.payment.khalti.secret=${KHALTI_SECRET:}
app.payment.khalti.initiate-url=${KHALTI_INITIATE_URL:https://dev.khalti.com/api/v2/epayment/initiate/}
app.payment.khalti.lookup-url=${KHALTI_LOOKUP_URL:https://dev.khalti.com/api/v2/epayment/lookup/}

# Public contact form inbox (falls back to spring.mail.username)
app.contact.inbox=${CONTACT_INBOX:}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.root=INFO
logging.level.com.RAP.backend=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.amqp=WARN
logging.level.org.hibernate.SQL=WARN