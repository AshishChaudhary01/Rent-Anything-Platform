<p style="margin:0 0 6px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#0960AC;font-weight:700;">{{kindLabel}}</p>
<p style="font-size:22px;font-weight:800;margin:0 0 12px;color:#2E333A;">{{title}}</p>
<p style="margin:0 0 16px;line-height:1.6;color:#2E333A;">{{bodyText}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;background:#DBEAFE;border:1px solid #D8E3F8;border-radius:12px;">
  <tr>
    <td style="padding:14px 16px;">
      <p style="margin:0 0 6px;font-size:13px;font-weight:700;color:#1D4ED8;">What this notice means</p>
      <p style="margin:0;font-size:13px;line-height:1.55;color:#5B5F67;">{{notice}}</p>
    </td>
  </tr>
</table>
<p style="margin:0 0 8px;">
  <a href="{{actionUrl}}" style="display:inline-block;background:#0960AC;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px;">{{actionLabel}}</a>
</p>
<p style="margin:16px 0 0;color:#5B5F67;font-size:13px;line-height:1.5;">Open RAP to see the full details and take the next step. This email is a summary only.</p>
