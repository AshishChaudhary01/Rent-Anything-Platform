<p style="font-size:18px;font-weight:700;margin:0 0 4px;">Payment receipt</p>
<p style="margin:0 0 20px;color:#6b7280;">{{kindLabel}} · {{paidAt}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;">
  <tr><td style="padding:6px 0;color:#6b7280;">Receipt</td><td align="right" style="padding:6px 0;">{{receiptNo}}</td></tr>
  <tr><td style="padding:6px 0;color:#6b7280;">Listing</td><td align="right" style="padding:6px 0;">{{listingTitle}}</td></tr>
  <tr><td style="padding:6px 0;color:#6b7280;">Renter</td><td align="right" style="padding:6px 0;">{{renterName}}</td></tr>
  <tr><td style="padding:6px 0;color:#6b7280;">Dates</td><td align="right" style="padding:6px 0;">{{dates}}</td></tr>
  <tr><td style="padding:6px 0;color:#6b7280;">Gateway</td><td align="right" style="padding:6px 0;">{{gateway}}</td></tr>
  <tr><td style="padding:6px 0;color:#6b7280;">Reference</td><td align="right" style="padding:6px 0;">{{paymentRef}}</td></tr>
  <tr><td style="padding:12px 0 0;font-weight:700;border-top:1px solid #eee;">Amount paid</td><td align="right" style="padding:12px 0 0;font-weight:700;color:#c2410c;border-top:1px solid #eee;">Nrs. {{amount}}</td></tr>
</table>
<p style="margin:20px 0 0;color:#6b7280;font-size:13px;">Keep this receipt for your records. RAP holds commitment fees in escrow until the rental is completed.</p>
